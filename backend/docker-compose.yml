services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kampungdigital-api
    image: kampungdigital-api:latest
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_API_PORT:-5106}:5006"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kampungdigital-network

  db:
    container_name: kampungdigital-db
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kampungdigital-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  kampungdigital-network:
    driver: bridge